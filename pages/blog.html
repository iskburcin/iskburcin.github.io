<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.blog">Blog · Burçin Işık</title>
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script type="module" src="/assets/js/blog.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section class="page-head">
        <h1 data-i18n="blog.title">Blog · travel stories</h1>
        <p data-i18n="blog.intro">Memories, small adventures and things I learned on the road.</p>
      </section>
      <div class="toolbar" id="filters" role="group"></div>
      <!-- Posts come from /posts/index.json + /posts/<slug>/<lang>.md -->
      <section class="post-grid" id="posts"></section>
    </main>
  </body>
</html>
