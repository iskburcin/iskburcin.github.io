<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.contact">Contact · Burçin Işık</title>
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script type="module" src="/assets/js/contact.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section class="page-head">
        <h1 data-i18n="contact.title">Let's talk</h1>
        <p id="intro"></p>
      </section>

      <div class="contact-layout">
        <section class="card">
          <!-- Sent with Formspree (set contact.formEndpoint in /data/site.json).
               Without an endpoint, it opens your mail app instead. -->
          <form class="form" id="form" novalidate>
            <div class="field">
              <span class="label" id="topic-label" data-i18n="contact.topic" style="font-weight:600;font-size:.9rem">What is it about?</span>
              <div class="topic-chips" id="topics" role="radiogroup" aria-labelledby="topic-label"></div>
            </div>
            <div class="two">
              <div class="field">
                <label for="name" data-i18n="contact.name">Your name</label>
                <input id="name" name="name" autocomplete="name" required maxlength="80" />
                <span class="error" aria-live="polite"></span>
              </div>
              <div class="field">
                <label for="email" data-i18n="contact.email">Your email</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="120" />
                <span class="error" aria-live="polite"></span>
              </div>
            </div>
            <div class="field">
              <label for="message" data-i18n="contact.message">Message</label>
              <textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea>
              <div class="hint"><span class="error" aria-live="polite"></span><span id="chars">0 / 2000</span></div>
            </div>
            <!-- honeypot: humans don't see it, spam bots fill it -->
            <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <button class="btn btn--primary" type="submit" id="send"><i class="fa-solid fa-paper-plane"></i> Send message</button>
            <p class="form-status" id="status" role="status" hidden></p>
          </form>
        </section>

        <aside class="contact-side">
          <section class="card" id="now"></section>
          <section class="card">
            <h3 data-i18n="contact.emailTitle">Email</h3>
            <div class="email-box" id="email-box"></div>
          </section>
          <section class="card">
            <h3 data-i18n="contact.online">Find me online</h3>
            <div class="social-list" id="socials"></div>
          </section>
          <section class="card faq" id="faq"><h3 data-i18n="contact.faq">FAQ</h3></section>
        </aside>
      </div>
    </main>
  </body>
</html>
